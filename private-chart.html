<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; frame-src blob:; object-src blob:; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f766e"><link rel="icon" type="image/png" sizes="32x32" href="./favicon-v5.png"><link rel="apple-touch-icon" href="./apple-touch-icon-v5.png"><title>Patient chart · ملف المريض</title><style>
:root{--ink:#172d34;--muted:#4f6b70;--line:#d6e4e3;--brand:#0f766e;--brand-dark:#115e59;--bg:#f2f6f6;--card:#fff}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Noto Naskh Arabic",sans-serif}
.top{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 20px}
.top-inner,main{max-width:820px;margin:auto}.clinic{display:flex;align-items:center;gap:10px;font-weight:650;opacity:.95}.clinic img{width:34px;height:34px;border-radius:8px}
h1{font-size:1.65rem;line-height:1.25;margin:14px 0 2px}#file-id{margin:0;opacity:.85;font-size:.95rem}
main{padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 6px}
button{font:inherit;font-weight:650;min-height:44px;padding:9px 16px;border-radius:10px;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:#fff}
button.secondary,#close{background:#fff;color:var(--brand-dark);border-color:#bcd3d1}button:focus-visible{outline:3px solid #f5c400;outline-offset:2px}
.notice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--muted)}.notice.error{border-color:#f0b4ad;background:#fff6f5;color:#8a2a1f}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:16px 0;box-shadow:0 1px 3px #0f172a0d;overflow:hidden}
.card h2{margin:0;padding:12px 16px;font-size:1.05rem;color:var(--brand-dark);background:#f6fbfa;border-bottom:1px solid var(--line)}
.record{padding:14px 16px}.record+.record{border-top:1px solid var(--line)}.record-date{margin:0 0 8px;font-weight:700;color:var(--brand-dark)}
.facts{display:grid;grid-template-columns:minmax(120px,34%) 1fr;gap:6px 14px;margin:0 0 12px}.facts dt{color:var(--muted);font-weight:600}.facts dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.nested{border-inline-start:3px solid var(--line);padding-inline-start:10px;margin:4px 0}.nested .facts{margin:0}ul.plain{margin:0;padding-inline-start:18px}
table.rx{width:100%;border-collapse:collapse;margin:0 0 12px;font-variant-numeric:tabular-nums}table.rx th,table.rx td{border:1px solid var(--line);padding:7px 6px;text-align:center}table.rx tr:first-child th{background:#eef6f5;color:var(--brand-dark)}table.rx td{font-weight:600}
img{max-width:100%;border-radius:8px}a{color:var(--brand-dark)}
@media(max-width:520px){.facts{grid-template-columns:1fr;gap:0}.facts dt{margin-top:8px;font-size:.88rem}h1{font-size:1.4rem}table.rx{font-size:.9rem}}
</style><script src="./clinic-pdf.bundle.js" defer></script><script src="./private-chart.js" defer></script></head><body><header class="top"><div class="top-inner"><div class="clinic"><img src="./apple-touch-icon-v5.png" alt=""><span>Dr. Mahmoud Sami Abouzeid · د. محمود سامي أبوزيد</span></div><h1 id="name" dir="auto">Patient chart · ملف المريض</h1><p id="file-id" dir="auto"></p></div></header><main><p id="status" class="notice" role="status">Opening your chart… · جارٍ فتح ملفك الطبي</p><div class="actions"><button id="chart-pdf" type="button" hidden>Printable PDF · ملف للطباعة</button><button id="close" type="button" hidden>Close chart · إغلاق الملف</button></div><div id="records"></div></main></body></html>
